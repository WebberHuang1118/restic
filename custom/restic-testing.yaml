apiVersion: batch/v1
kind: Job
metadata:
  name: restic-testing
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: backup
        image: webberhuang/restic:latest
        imagePullPolicy: IfNotPresent
        envFrom:
          - secretRef:
              name: restic-creds
        command: ["sleep"]
        args:
          - "3600"
        volumeDevices:
          - name: vol1
            devicePath: /dev/vol1
          - name: vol2
            devicePath: /dev/vol2
        securityContext:
          privileged: true
      volumes:
      - name: vol1
        persistentVolumeClaim:
          claimName: vol1
      - name: vol2
        persistentVolumeClaim:
          claimName: vol2
