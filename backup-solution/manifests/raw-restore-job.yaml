apiVersion: batch/v1
kind: Job
metadata:
  name: raw-restore-job
  namespace: default
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: raw-restore
        image: ubuntu:latest
        envFrom:
          - secretRef:
              name: restic-env
        command:
          - /bin/bash
          - -c
          - |
            set -e
            echo "Installing required packages..."
            apt update && apt install -y restic awscli dd util-linux
            DEVICE="/dev/block-device"
            if [ ! -b "$DEVICE" ]; then
              echo "Block device $DEVICE not found."
              exit 1
            fi
            echo "Restoring raw backup to $DEVICE..."
            restic restore latest --stdout --stdin-filename raw-backup.img | dd of=$DEVICE bs=4M status=progress
            echo "Raw restore completed."
        volumeDevices:
          - name: pvc-storage
            devicePath: /dev/block-device
      volumes:
        - name: pvc-storage
          persistentVolumeClaim:
            claimName: my-block-pvc
